[package]
name = "setl8-vault"
version = "0.1.0"
description = "Setl8 on-chain vault: evaluation fee collection, fee splitting, and payout management"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "setl8_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1", features = ["token", "associated_token"] }
