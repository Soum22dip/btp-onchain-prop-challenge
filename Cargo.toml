[workspace]
members = [
    "programs/setl8-vault"
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# Vendor patches: blake3 1.8.3 and constant_time_eq 0.4.2 both use
# edition = "2024" which requires Cargo >=1.85. The Solana 1.18 platform-tools
# ship Cargo 1.75, so we replace them with identical copies using edition = "2021".
[patch.crates-io]
constant_time_eq = { path = "vendor/constant_time_eq" }
blake3 = { path = "vendor/blake3" }
indexmap = { path = "vendor/indexmap" }
proc-macro-crate = { path = "vendor/proc-macro-crate" }
